<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Checkout and pickup | Formex Communication</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/assets/commerce.css" />
    <link rel="stylesheet" href="/assets/formex-service.css" />
  </head>
  <body>
    <main class="service">
      <a href="/" class="wordmark">Formex Communication</a>
      <h1>Checkout and pickup</h1>
      <p id="notice" role="status" aria-live="polite"></p>
      <form id="order" hidden>
        <label>Device<select name="slug"></select></label
        ><label>Variant<select name="storage"></select></label
        ><label>Condition<select name="condition"></select></label
        ><label>Preferred colour<select name="color"></select></label
        ><label>Receive your device<select name="fulfilment"></select></label>
        <p id="pickup"></p>
        <label id="address" hidden
          >Delivery address<textarea
            name="address"
            maxlength="500"
          ></textarea></label
        ><label>Payment method<select name="method"></select></label
        ><label
          >Your name<input
            name="name"
            autocomplete="name"
            required
            maxlength="160" /></label
        ><label
          >Email<input
            name="email"
            type="email"
            autocomplete="email"
            required
            maxlength="254" /></label
        ><label
          >Phone<input name="phone" type="tel" autocomplete="tel" required
        /></label>
        <p id="total"></p>
        <button>Place order</button>
      </form>
      <details id="ask">
        <summary>Ask Formex about a device</summary>
        <form id="enquiry">
          <label>Your email or phone<input name="contact" required /></label
          ><label
            >Question<textarea
              name="message"
              required
              maxlength="1000"
            ></textarea></label
          ><button>Send enquiry</button>
        </form>
      </details>
      <p><a href="/#products">Continue shopping</a></p>
    </main>
    <script type="module" src="/assets/formex-checkout.js"></script>
  </body>
</html>
